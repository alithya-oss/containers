name: Build & push multica-daemon to ECR

# Build the multica-daemon image whenever its Dockerfile (or workspace) changes
# on main, or on a semver tag release, then push to the private Amazon ECR
# repository provisioned by alithya-oss/multica-on-aws
# (infrastructure/cloudformation/ecr.yaml). ECR's ScanOnPush (already enabled
# on that repository) scans every pushed image automatically; this workflow
# waits for that scan and FAILS the run on any CRITICAL/HIGH finding, so a
# vulnerable image never reports as successfully "published" even though the
# immutable tag itself cannot be deleted/overwritten after the fact.
#
# This is the one image in the monorepo published to ECR instead of GHCR — see
# images/multica-daemon/README.md "CI/CD" for the rationale (deployed by a
# private ECS Fargate task, not meant for public/GHCR distribution).
on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'images/multica-daemon/**'
      - '.github/workflows/build-and-push-ecr.yaml'

concurrency:
  group: build-push-ecr-multica-daemon-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required by aws-actions/configure-aws-credentials for OIDC federation
  # (no stored AWS access keys in this repository).
  id-token: write

env:
  IMAGE_NAME: multica-daemon
  AWS_REGION: ${{ vars.MULTICA_DAEMON_AWS_REGION || 'us-east-1' }}

jobs:
  build-and-push:
    name: Build, push & scan-gate ${{ 'multica-daemon' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get the version
        run: echo "IMAGE_SPEC=$(jq -c . < images/${{ env.IMAGE_NAME }}/image-specs.json)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.0.2
        with:
          role-to-assume: ${{ vars.MULTICA_DAEMON_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aa173f93e097254ea5d6d983b0ae0 # v2.0.1

      - name: Resolve ECR repository URI and image tag
        run: |
          echo "ECR_REPOSITORY_URI=${{ steps.ecr-login.outputs.registry }}/${{ vars.MULTICA_DAEMON_ECR_REPOSITORY_NAME || 'multica-kiro-daemon' }}" >> "$GITHUB_ENV"
          # Immutable, auditable tag per build — matches the ImageTag parameter
          # consumed by compute.yaml's task definition (ALIT-9). "latest" is
          # intentionally never pushed: ImageTagMutability: IMMUTABLE on the
          # repository means a floating tag could not be updated anyway, and
          # the deployment pipeline (ALIT-11) is expected to pin an exact tag.
          echo "IMAGE_TAG=${{ fromJson(env.IMAGE_SPEC).version }}-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build and push
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./images/${{ env.IMAGE_NAME }}
          file: ./images/${{ env.IMAGE_NAME }}/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ fromJson(env.IMAGE_SPEC).version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ${{ env.ECR_REPOSITORY_URI }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.description=Node.js LTS image running the Multica CLI agent daemon with kiro-cli on PATH.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ fromJson(env.IMAGE_SPEC).version }}

      # ECR starts the ScanOnPush scan asynchronously the moment the image
      # manifest lands — poll describe-image-scan-findings until it reports a
      # terminal status (COMPLETE/FAILED) rather than a fixed sleep, bounded
      # so a stuck scan cannot hang the job forever.
      - name: Wait for ECR vulnerability scan to complete
        id: scan-wait
        run: |
          set -euo pipefail
          repo="${{ vars.MULTICA_DAEMON_ECR_REPOSITORY_NAME || 'multica-kiro-daemon' }}"
          tag="${{ env.IMAGE_TAG }}"
          for i in $(seq 1 30); do
            status=$(aws ecr describe-image-scan-findings \
              --repository-name "${repo}" \
              --image-id imageTag="${tag}" \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null || echo "PENDING")
            echo "Scan status (attempt ${i}/30): ${status}"
            if [[ "${status}" == "COMPLETE" || "${status}" == "FAILED" ]]; then
              echo "status=${status}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the ECR scan to finish." >&2
          echo "status=TIMEOUT" >> "$GITHUB_OUTPUT"
          exit 1

      # Gate publication on severity: any CRITICAL or HIGH finding fails the
      # job. The immutable tag already exists in ECR at this point (a scan
      # can only target a pushed image) — this step's role is to make the CI
      # run itself red, so branch protection / release automation never
      # treats a vulnerable build as a successful, deployable one. The
      # repository's lifecycle policy (ecr.yaml) still expires it on the
      # normal untagged/20-image-retention schedule; nothing deploys it
      # because ALIT-11's deployment pipeline only promotes a tag off a
      # green CI run.
      - name: Gate on scan findings (fail on CRITICAL/HIGH)
        if: steps.scan-wait.outputs.status == 'COMPLETE'
        run: |
          set -euo pipefail
          repo="${{ vars.MULTICA_DAEMON_ECR_REPOSITORY_NAME || 'multica-kiro-daemon' }}"
          tag="${{ env.IMAGE_TAG }}"
          findings=$(aws ecr describe-image-scan-findings \
            --repository-name "${repo}" \
            --image-id imageTag="${tag}" \
            --output json)

          echo "${findings}" | jq '.imageScanFindings.findingSeverityCounts // {}'

          critical=$(echo "${findings}" | jq '.imageScanFindings.findingSeverityCounts.CRITICAL // 0')
          high=$(echo "${findings}" | jq '.imageScanFindings.findingSeverityCounts.HIGH // 0')

          if [[ "${critical}" -gt 0 || "${high}" -gt 0 ]]; then
            echo "::error::ECR scan found ${critical} CRITICAL and ${high} HIGH severity vulnerabilities in ${repo}:${tag}. Failing the build — this image must not be treated as published."
            exit 1
          fi

          echo "No CRITICAL/HIGH findings. ${repo}:${tag} is clear to use."

      - name: Fail if the scan itself failed
        if: steps.scan-wait.outputs.status == 'FAILED'
        run: |
          echo "::error::ECR could not complete the vulnerability scan for this image (imageScanStatus=FAILED)." >&2
          exit 1
