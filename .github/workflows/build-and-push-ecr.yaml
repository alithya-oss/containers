name: Build & push multica-daemon to ECR

# Build the multica-daemon image whenever its Dockerfile (or workspace) changes
# on main, or on a semver tag release, then push to the private Amazon ECR
# repository provisioned by alithya-oss/multica-on-aws
# (infrastructure/cloudformation/ecr.yaml). ECR's ScanOnPush (already enabled
# on that repository) scans every pushed image automatically; this workflow
# waits for that scan and FAILS the run on any CRITICAL finding (HIGH is reported as a warning), so a
# vulnerable image never reports as successfully "published". Only after the
# gate passes are the floating semver tags (X, X.Y, X.Y.Z) added.
#
# This is the one image in the monorepo published to ECR instead of GHCR — see
# images/multica-daemon/README.md "CI/CD" for the rationale (deployed by a
# private ECS Fargate task, not meant for public/GHCR distribution).
on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'images/multica-daemon/**'
      - '.github/workflows/build-and-push-ecr.yaml'

concurrency:
  group: build-push-ecr-multica-daemon-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required by aws-actions/configure-aws-credentials for OIDC federation
  # (no stored AWS access keys in this repository).
  id-token: write

env:
  IMAGE_NAME: multica-daemon
  AWS_REGION: ${{ vars.MULTICA_DAEMON_AWS_REGION || 'us-east-1' }}

jobs:
  build-and-push:
    name: Build, push & scan-gate ${{ 'multica-daemon' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get the version
        run: echo "IMAGE_SPEC=$(jq -c . < images/${{ env.IMAGE_NAME }}/image-specs.json)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.0.2
        with:
          role-to-assume: ${{ vars.MULTICA_DAEMON_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Resolve ECR repository URI and image tag
        run: |
          echo "ECR_REPOSITORY_URI=${{ steps.ecr-login.outputs.registry }}/${{ vars.MULTICA_DAEMON_ECR_REPOSITORY_NAME || 'multica-kiro-daemon' }}" >> "$GITHUB_ENV"
          # Build tag: <version>-<sha12>, unique per commit and the exact
          # reference the deployment pipeline (ALIT-11) should pin. The floating
          # semver tags (X, X.Y, X.Y.Z) are added only after the scan gate
          # passes, in the "Promote semver tags" step, so a vulnerable build
          # never moves them. This requires the repository to be MUTABLE
          # (ecr.yaml); "latest" is intentionally never pushed.
          echo "IMAGE_TAG=${{ fromJson(env.IMAGE_SPEC).version }}-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build and push
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./images/${{ env.IMAGE_NAME }}
          file: ./images/${{ env.IMAGE_NAME }}/Dockerfile
          push: true
          platforms: linux/amd64
          # SBOM attestation is attached, so the tag points at an OCI index.
          # ECR ScanOnPush does not scan the index itself, only the platform
          # image manifest, so the scan steps below target that digest.
          provenance: false
          sbom: true
          build-args: |
            VERSION=${{ fromJson(env.IMAGE_SPEC).version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ${{ env.ECR_REPOSITORY_URI }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.description=Debian slim image with Node.js 24 (nvm), Python 3, kiro-cli and goose running the Multica CLI agent daemon.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ fromJson(env.IMAGE_SPEC).version }}

      # The tag resolves to an OCI index (image + SBOM attestation). ECR scans
      # the linux/amd64 image manifest, so resolve its digest for the scan steps.
      - name: Resolve image manifest digest to scan
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect --raw "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" \
            | jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest')
          if [[ -z "${digest}" || "${digest}" == "null" ]]; then
            echo "::error::Could not resolve the linux/amd64 manifest digest for ${ECR_REPOSITORY_URI}:${IMAGE_TAG}" >&2
            exit 1
          fi
          echo "SCAN_DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "Scanning ${digest}"

      # ECR starts the ScanOnPush scan asynchronously the moment the image
      # manifest lands — poll describe-image-scan-findings until it reports a
      # terminal status (COMPLETE/FAILED) rather than a fixed sleep, bounded
      # so a stuck scan cannot hang the job forever.
      - name: Wait for ECR vulnerability scan to complete
        id: scan-wait
        run: |
          set -euo pipefail
          repo="${{ vars.MULTICA_DAEMON_ECR_REPOSITORY_NAME || 'multica-kiro-daemon' }}"
          tag="${{ env.IMAGE_TAG }}"
          for i in $(seq 1 30); do
            status=$(aws ecr describe-image-scan-findings \
              --repository-name "${repo}" \
              --image-id imageDigest="${SCAN_DIGEST}" \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null || echo "PENDING")
            echo "Scan status (attempt ${i}/30): ${status}"
            if [[ "${status}" == "COMPLETE" || "${status}" == "FAILED" ]]; then
              echo "status=${status}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the ECR scan to finish." >&2
          echo "status=TIMEOUT" >> "$GITHUB_OUTPUT"
          exit 1

      # Gate publication on severity: any CRITICAL finding fails the
      # job. The immutable tag already exists in ECR at this point (a scan
      # can only target a pushed image) — this step's role is to make the CI
      # run itself red, so branch protection / release automation never
      # treats a vulnerable build as a successful, deployable one. The
      # repository's lifecycle policy (ecr.yaml) still expires it on the
      # normal untagged/20-image-retention schedule; nothing deploys it
      # because ALIT-11's deployment pipeline only promotes a tag off a
      # green CI run.
      - name: Gate on scan findings (fail on CRITICAL)
        if: steps.scan-wait.outputs.status == 'COMPLETE'
        run: |
          set -euo pipefail
          repo="${{ vars.MULTICA_DAEMON_ECR_REPOSITORY_NAME || 'multica-kiro-daemon' }}"
          tag="${{ env.IMAGE_TAG }}"
          findings=$(aws ecr describe-image-scan-findings \
            --repository-name "${repo}" \
            --image-id imageDigest="${SCAN_DIGEST}" \
            --output json)

          echo "${findings}" | jq '.imageScanFindings.findingSeverityCounts // {}'

          critical=$(echo "${findings}" | jq '.imageScanFindings.findingSeverityCounts.CRITICAL // 0')
          high=$(echo "${findings}" | jq '.imageScanFindings.findingSeverityCounts.HIGH // 0')

          # HIGH findings are reported but do not fail the build: the remaining
          # ones are OS packages (krb5, git, glibc, cyrus-sasl2) with no fixed
          # version in Debian yet. Only CRITICAL blocks publication.
          if [[ "${high}" -gt 0 ]]; then
            echo "::warning::ECR scan found ${high} HIGH severity vulnerabilities in ${repo}:${tag} (not blocking)."
          fi

          if [[ "${critical}" -gt 0 ]]; then
            echo "::error::ECR scan found ${critical} CRITICAL severity vulnerabilities in ${repo}:${tag}. Failing the build — this image must not be treated as published."
            exit 1
          fi

          echo "No CRITICAL findings. ${repo}:${tag} is clear to use."

      # Promote the scanned image to floating semver tags (X, X.Y, X.Y.Z) by
      # re-tagging the exact manifest that was scanned. Runs only when the gate
      # above passed. Pre-release versions (e.g. 1.0.0-rc1) are not promoted.
      - name: Promote semver tags (X, X.Y, X.Y.Z)
        if: steps.scan-wait.outputs.status == 'COMPLETE'
        run: |
          set -euo pipefail
          repo="${{ vars.MULTICA_DAEMON_ECR_REPOSITORY_NAME || 'multica-kiro-daemon' }}"
          version="${{ fromJson(env.IMAGE_SPEC).version }}"
          if [[ ! "${version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version ${version} is not X.Y.Z; skipping semver tag promotion."
            exit 0
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          image=$(aws ecr batch-get-image --repository-name "${repo}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --accepted-media-types application/vnd.oci.image.index.v1+json application/vnd.oci.image.manifest.v1+json \
            --query 'images[0]' --output json)
          manifest=$(echo "${image}" | jq -r '.imageManifest')
          media_type=$(echo "${image}" | jq -r '.imageManifestMediaType')
          for t in "${major}" "${major}.${minor}" "${version}"; do
            if out=$(aws ecr put-image --repository-name "${repo}" \
                --image-tag "${t}" --image-manifest "${manifest}" \
                --image-manifest-media-type "${media_type}" 2>&1); then
              echo "Tagged ${repo}:${t}"
            elif [[ "${out}" == *ImageAlreadyExistsException* ]]; then
              echo "${repo}:${t} already points at this image."
            else
              echo "${out}" >&2
              exit 1
            fi
          done

      - name: Fail if the scan itself failed
        if: steps.scan-wait.outputs.status == 'FAILED'
        run: |
          echo "::error::ECR could not complete the vulnerability scan for this image (imageScanStatus=FAILED)." >&2
          exit 1
