name: Renovate

# Self-hosted Renovate run. Reads ./renovate.json (regex manager for the
# `# renovate:` annotated ARGs in images/*/Dockerfile, Docker digests and
# GitHub Actions pins) and opens the update PRs.
# ref: https://github.com/renovatebot/github-action
on:
  schedule:
    # Every 6 hours.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (log what would change, open no PRs)
        type: boolean
        default: false
      log_level:
        description: Renovate log level
        type: choice
        options:
          - info
          - debug
        default: info
  # Re-run when the Renovate config itself changes so errors surface quickly.
  push:
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yaml

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # RENOVATE_TOKEN: a PAT or GitHub App installation token with
      # contents, pull-requests, issues and workflows (read & write) plus
      # metadata (read). The default GITHUB_TOKEN is not used on purpose:
      # PRs it opens do not trigger the pr-build / hadolint workflows, and it
      # cannot update files under .github/workflows.
      - name: Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The repository already ships a renovate.json; never open an
          # onboarding PR.
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          # Needed to resolve ghcr.io/kirodotdev/kirocrew digests and release
          # notes without hitting anonymous rate limits.
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
