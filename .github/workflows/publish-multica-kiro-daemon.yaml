name: Publish multica-kiro-daemon to ECR

# Scoped to this one image, separate from build-container.yaml (which pushes
# the catalog to GHCR): the ECS Fargate service designed in ALIT-9 pulls this
# image from an ECR repository in the target AWS account, not GHCR. Image
# vulnerability scanning happens via ECR's own ScanOnPush (ecr.yaml) — no
# separate scan step is duplicated here.
on:
  push:
    branches:
      - main
    paths:
      - 'images/multica-kiro-daemon/**'
      - '.github/workflows/publish-multica-kiro-daemon.yaml'
  tags:
    - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: publish-multica-kiro-daemon-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # OIDC federation to assume the AWS IAM role — no long-lived AWS keys
  # stored as repo/org secrets.
  id-token: write

jobs:
  publish:
    name: Build & push to ECR
    runs-on: ubuntu-latest
    # Requires the following repository/environment variables and secrets to
    # be configured before this job can run (see README "CI configuration"):
    #   vars.AWS_REGION               - e.g. us-east-1
    #   secrets.AWS_ECR_PUSH_ROLE_ARN - IAM role ARN this workflow assumes via OIDC
    #   vars.ECR_REPOSITORY_URI       - e.g. <account-id>.dkr.ecr.<region>.amazonaws.com/multica-kiro-daemon
    # None of these are set yet in this repository as of ALIT-10 — see the
    # delivery comment on ALIT-10 for what ALIT-12 (environment-provisioning)
    # needs to supply.
    environment: aws-multica-daemon
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get the version
        run: echo "IMAGE_SPEC=$(jq -c . < images/multica-kiro-daemon/image-specs.json)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build and push
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./images/multica-kiro-daemon
          file: ./images/multica-kiro-daemon/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ fromJson(env.IMAGE_SPEC).version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ${{ vars.ECR_REPOSITORY_URI }}:latest
            ${{ vars.ECR_REPOSITORY_URI }}:${{ fromJson(env.IMAGE_SPEC).version }}
            ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.description=Multica agent daemon with Kiro CLI, built for ECS Fargate (alithya-oss/multica-on-aws ALIT-9).
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ fromJson(env.IMAGE_SPEC).version }}

      # ECR's ScanOnPush (ecr.yaml) runs asynchronously after the push above;
      # wait for and surface its result so a CRITICAL/HIGH finding fails the
      # pipeline before ALIT-13 ever deploys this tag, rather than silently
      # publishing a vulnerable image.
      - name: Wait for ECR scan result
        env:
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          repo_name="$(basename "${{ vars.ECR_REPOSITORY_URI }}")"
          tag="${{ github.sha }}"
          for _ in $(seq 1 30); do
            status=$(aws ecr describe-image-scan-findings \
              --repository-name "${repo_name}" \
              --image-id imageTag="${tag}" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo PENDING)
            if [ "${status}" = "COMPLETE" ] || [ "${status}" = "FAILED" ]; then
              break
            fi
            sleep 10
          done
          echo "Scan status: ${status}"
          if [ "${status}" != "COMPLETE" ]; then
            echo "ECR scan did not complete in time; check the console." >&2
            exit 1
          fi
          critical_high=$(aws ecr describe-image-scan-findings \
            --repository-name "${repo_name}" \
            --image-id imageTag="${tag}" \
            --query 'imageScanFindings.findingSeverityCounts.[CRITICAL,HIGH]' \
            --output text | tr '\t' '+' | awk -F+ '{s=0; for(i=1;i<=NF;i++) if ($i!="None") s+=$i; print s}')
          echo "CRITICAL+HIGH findings: ${critical_high}"
          if [ "${critical_high}" != "0" ]; then
            echo "Image has ${critical_high} CRITICAL/HIGH vulnerability finding(s) — failing before ALIT-13 can deploy this tag." >&2
            exit 1
          fi
