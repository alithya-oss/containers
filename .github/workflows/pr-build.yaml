name: PR container image build

# Build ONLY the image workspaces changed by the PR, WITHOUT pushing them.
# The build warms the same registry cache the push-to-main workflow reads
# (`ghcr.io/<owner>/<image>:cache`), so once a PR is merged the main build is
# served almost entirely from cache.
on:
  pull_request:
    branches:
      - main

# Cancel superseded runs for the same PR to save CI minutes.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to read/write the GHCR registry cache on same-repo PRs.
  packages: write

jobs:
  detect:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history (no blobs) so merge-base diffing is accurate.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x
      - name: List changed images
        id: detect
        run: node ./scripts/ci/list-changed-images.js
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}

  build:
    name: Build ${{ matrix.image }} (no push)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.has_changes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get the version
        run: echo "IMAGE_SPEC=$(jq -c . < images/${{ matrix.image }}/image-specs.json)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      # Fork PRs cannot write to the GHCR cache (no package:write token), so we
      # only log in and warm the cache for same-repo PRs. Fork PRs still build
      # (read-only cache) but simply skip the cache write.
      - name: Detect same-repo PR
        id: samerepo
        run: echo "value=${{ github.event.pull_request.head.repo.full_name == github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: steps.samerepo.outputs.value == 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (no push)
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./images/${{ matrix.image }}
          file: ./images/${{ matrix.image }}/Dockerfile
          push: false
          load: false
          platforms: linux/amd64
          # Read the shared registry cache to speed the PR build up, and write
          # it back (same ref the push-to-main workflow uses) so the eventual
          # merge build is served from cache. Cache write is skipped on forks.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:cache
          cache-to: ${{ steps.samerepo.outputs.value == 'true' && format('type=registry,ref=ghcr.io/{0}/{1}:cache,mode=max', github.repository_owner, matrix.image) || '' }}
          build-args: |
            VERSION=${{ fromJson(env.IMAGE_SPEC).version }}
            VCS_REF=${{ github.event.pull_request.head.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

  # Single required status check: with a dynamic matrix the individual build
  # legs have variable names, so branch protection cannot require them — it
  # requires this aggregator instead. Green when every changed image built (or
  # when nothing needed building).
  result:
    name: PR build result
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [detect, build]
    steps:
      - name: Verify no build failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "All changed images built successfully (or none needed building)."
