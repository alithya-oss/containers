name: Container image build & push

# Push to main: build & push ONLY the image workspaces changed by the merge.
# Tag push (release): build & push the WHOLE catalog.
on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: build-container-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  detect:
    name: Detect images to build
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.pick.outputs.images }}
      has_changes: ${{ steps.pick.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none

      # On a tag (release) build the whole catalog; on a branch push build only
      # what changed since the previous commit.
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x

      - name: Select images
        id: pick
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "Tag push: building the whole catalog."
            all=$(node -e "const fs=require('fs');console.log(JSON.stringify(fs.readdirSync('images',{withFileTypes:true}).filter(d=>d.isDirectory()&&fs.existsSync('images/'+d.name+'/Dockerfile')).map(d=>d.name).sort()))")
            echo "images=${all}" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            node ./scripts/ci/list-changed-images.js
          fi
        env:
          # For a branch push, diff against the commit before the push.
          BASE_REF: ${{ github.event.before }}

  build:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.has_changes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get the version
        run: echo "IMAGE_SPEC=$(jq -c . < images/${{ matrix.image }}/image-specs.json)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:cache,mode=max
          context: ./images/${{ matrix.image }}
          file: ./images/${{ matrix.image }}/Dockerfile
          push: true
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          build-args: |
            VERSION=${{ fromJson(env.IMAGE_SPEC).version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ fromJson(env.IMAGE_SPEC).version }}
          labels: |
            org.opencontainers.image.description=Container image containing tools for infra-as-code pipelines to AWS.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ fromJson(env.IMAGE_SPEC).version }}

  result:
    name: Build result
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [detect, build]
    steps:
      - name: Verify no build failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "All selected images built & pushed (or none needed building)."
